<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro presenze</title>
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1322" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presenze">
   <link rel="apple-touch-icon" href="IMG_1627.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna stretta pensata per iPhone, una schermata alla volta.
   Barra in alto con tasto casa, contenuti a pollice, azioni principali larghe come lo schermo. */
:root{
  --font-display:"Bricolage Grotesque","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --ink:#16203A;
  --muted:#566178;
  --line:#D9DFEA;
  --accent:#2B4BD3;
  --on-accent:#FFFFFF;
  --on-accent-soft:rgba(255,255,255,.2);
  --accent-soft:#E3E9FD;
  --ring:rgba(43,75,211,.28);
  --ok:#0E6B4D;
  --ok-soft:#DCF2E9;
  --no:#B3312F;
  --no-soft:#FBE2E0;
  --on-no:#FFFFFF;
  --scrim:rgba(10,14,26,.5);
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 20px rgba(22,32,58,.06);
  --g-bg:#FFFFFF;
  --g-ink:#1F1F1F;
  --g-line:#DADCE0;
  --a-bg:#000000;
  --a-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322;
    --surface:#171E33;
    --ink:#E9EDF8;
    --muted:#9BA6C2;
    --line:#2A3455;
    --accent:#8AA0FF;
    --on-accent:#0E1322;
    --on-accent-soft:rgba(14,19,34,.16);
    --accent-soft:#222C55;
    --ring:rgba(138,160,255,.35);
    --ok:#5ED6A8;
    --ok-soft:#133A2F;
    --no:#FF8F8A;
    --no-soft:#42201F;
    --on-no:#2A0E0E;
    --scrim:rgba(0,0,0,.6);
    --shadow:none;
    --g-bg:#131314;
    --g-ink:#E3E3E3;
    --g-line:#8E918F;
    --a-bg:#FFFFFF;
    --a-ink:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322;
  --surface:#171E33;
  --ink:#E9EDF8;
  --muted:#9BA6C2;
  --line:#2A3455;
  --accent:#8AA0FF;
  --on-accent:#0E1322;
  --on-accent-soft:rgba(14,19,34,.16);
  --accent-soft:#222C55;
  --ring:rgba(138,160,255,.35);
  --ok:#5ED6A8;
  --ok-soft:#133A2F;
  --no:#FF8F8A;
  --no-soft:#42201F;
  --on-no:#2A0E0E;
  --scrim:rgba(0,0,0,.6);
  --shadow:none;
  --g-bg:#131314;
  --g-ink:#E3E3E3;
  --g-line:#8E918F;
  --a-bg:#FFFFFF;
  --a-ink:#000000;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 16px/1.45 var(--font-body);
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--bg);z-index:10;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{max-width:560px;margin:0 auto}

/* Intestazione delle schermate interne */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  display:flex;align-items:center;gap:14px;
  padding:12px 0;background:var(--bg);
}
.icon-btn{
  flex:none;width:48px;height:48px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--accent);
  display:grid;place-items:center;
}
.icon-btn:active{transform:scale(.96)}
.bar-text{min-width:0}
.kicker{font:600 13px/1.3 var(--font-body);color:var(--muted)}
.bar-title{font:700 24px/1.1 var(--font-display);letter-spacing:-.01em;margin:2px 0 0;overflow-wrap:anywhere;text-wrap:balance}

/* Home */
.hero{padding:28px 0 22px}
.eyebrow{margin:0;font:600 14px/1.3 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.hero-title{margin:6px 0 0;font:700 clamp(36px,10vw,46px)/1 var(--font-display);letter-spacing:-.025em}
.hero-title.small{font-size:clamp(28px,8vw,34px);line-height:1.08}
.stack{display:flex;flex-direction:column;gap:14px}
.tile{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  min-height:108px;padding:18px;border-radius:22px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow);transition:transform .12s;
}
.tile:active{transform:scale(.985)}
.tile--primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.tile--row{min-height:72px;padding:14px 18px;border-radius:18px;box-shadow:none}
.tile-ico{
  flex:none;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
}
.tile--row .tile-ico{width:42px;height:42px;border-radius:13px}
.tile--primary .tile-ico{background:var(--on-accent-soft);color:var(--on-accent)}
.tile-text{flex:1;min-width:0}
.tile-title{display:block;font:700 22px/1.15 var(--font-display);letter-spacing:-.01em}
.tile--row .tile-title{font-size:18px}
.tile-sub{display:block;margin-top:4px;font:400 14.5px/1.35 var(--font-body);color:var(--muted)}
.tile--primary .tile-sub{color:inherit;opacity:.88}
.tile-chev{flex:none;opacity:.55}

/* Contenuti comuni */
.screen{padding-top:6px}
.h2{margin:30px 0 10px;font:700 12.5px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0 0 16px;font:500 17px/1.4 var(--font-body)}
.note{margin:0 0 16px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font:500 15px/1.4 var(--font-body)}
.msg{min-height:22px;margin:14px 0 10px;font:500 14.5px/1.4 var(--font-body);color:var(--muted)}
.msg.err{color:var(--no)}
.msg.good{color:var(--ok)}
.field{display:flex;flex-direction:column;gap:8px}
.field+.field{margin-top:14px}
.label{font:600 14px/1.3 var(--font-body);color:var(--muted)}
.input{
  appearance:none;-webkit-appearance:none;width:100%;min-height:56px;padding:0 16px;
  font:500 17px/1.2 var(--font-body);color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;
}
.input::placeholder{color:var(--muted);opacity:.8}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}

.btn{
  appearance:none;-webkit-appearance:none;border:0;min-height:54px;padding:0 22px;border-radius:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:600 16.5px/1 var(--font-body);transition:transform .12s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-quiet{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-danger{background:var(--no);color:var(--on-no)}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;cursor:default}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.link-btn{
  appearance:none;border:0;background:none;padding:10px 4px;min-height:44px;
  font:600 15px/1.2 var(--font-body);color:var(--accent);text-decoration:underline;text-underline-offset:3px;
}
.link-btn.danger{color:var(--no)}

/* Accesso */
.pw{position:relative}
.pw .input{padding-right:104px}
.pw-btn{
  appearance:none;-webkit-appearance:none;position:absolute;right:6px;top:6px;height:44px;padding:0 12px;border:0;border-radius:10px;
  background:none;color:var(--accent);font:600 14.5px/1 var(--font-body);
}
.pw-btn:active{background:var(--accent-soft)}
.switch{margin-top:12px;text-align:center;color:var(--muted);font:400 15px/1.4 var(--font-body)}
.switch .link-btn{padding:10px 4px}
.sep{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--muted);font:600 13px/1 var(--font-body)}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:flex;flex-direction:column;gap:10px}
.btn-google{background:var(--g-bg);color:var(--g-ink);box-shadow:inset 0 0 0 1.5px var(--g-line)}
.btn-apple{background:var(--a-bg);color:var(--a-ink)}

/* Elenchi a righe, come le righe di un registro */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px}
.row--btn{width:100%;text-align:left;background:none;border:0}
.row--btn:active{background:var(--accent-soft)}
.num{flex:none;width:26px;text-align:right;font:500 13px/1 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0;font:600 16.5px/1.3 var(--font-body);overflow-wrap:anywhere}
.who small{display:block;margin-top:2px;font:400 14px/1.3 var(--font-body);color:var(--muted)}
.x-btn{
  flex:none;width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--muted);
  display:grid;place-items:center;
}
.x-btn:active{background:var(--no-soft);color:var(--no)}
.empty{padding:26px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted)}
.empty strong{display:block;margin-bottom:4px;font:700 18px/1.25 var(--font-display);color:var(--ink)}
.empty p{margin:0 0 14px;font:400 15px/1.45 var(--font-body)}
.empty .btn{min-height:50px}

/* Appello */
.tally{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.chip{
  display:inline-flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:999px;
  background:var(--surface);border:1.5px solid var(--line);font:600 14px/1 var(--font-body);
}
.chip b{font:700 19px/1 var(--font-display);font-variant-numeric:tabular-nums}
.chip--ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip--no{background:var(--no-soft);border-color:transparent;color:var(--no)}
.tools{display:flex;justify-content:flex-end;margin:0 0 6px}
.call-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px 12px;padding:10px 12px 10px 14px}
.call-row.missing{box-shadow:inset 0 0 0 2.5px var(--no)}
.seg{display:flex;gap:6px}
.seg button{
  appearance:none;-webkit-appearance:none;min-width:82px;min-height:46px;padding:0 10px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--muted);
  font:600 14.5px/1 var(--font-body);
}
.seg button:active{transform:scale(.97)}
.seg .on-ok[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg .on-no[aria-pressed="true"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
@media (max-width:380px){
  .call-row{grid-template-columns:26px 1fr}
  .call-row .seg{grid-column:2}
  .call-row .seg button{flex:1}
}

/* Esito e storico */
.done{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 0 4px}
.done-ico{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);margin-bottom:10px}
.done h2{margin:0;font:700 32px/1.05 var(--font-display);letter-spacing:-.02em}
.done p{margin:0;color:var(--muted);font:500 16px/1.4 var(--font-body)}
.names{margin:6px 0 0;font:400 15.5px/1.5 var(--font-body);overflow-wrap:anywhere}
.stack-s{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.rec summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;cursor:pointer}
.rec summary::-webkit-details-marker{display:none}
.rec .chev{flex:none;opacity:.55;transition:transform .15s}
.rec[open] .chev{transform:rotate(90deg)}
.rec-score{flex:none;font:700 20px/1 var(--font-display);font-variant-numeric:tabular-nums}
.rec-score small{font:500 13px/1 var(--font-body);color:var(--muted)}
.rec-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.rec-body h3{margin:14px 0 0;font:700 12.5px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase}
.rec-body h3.ok{color:var(--ok)}
.rec-body h3.no{color:var(--no)}

/* Finestra di conferma e avvisi */
.scrim{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{
  width:100%;max-width:560px;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
}
.sheet h2{margin:0 0 6px;font:700 22px/1.2 var(--font-display);overflow-wrap:anywhere}
.sheet p{margin:0 0 18px;color:var(--muted);font:400 15.5px/1.45 var(--font-body)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{
  position:fixed;z-index:50;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;
}
.toast[hidden]{display:none}
.toast span{max-width:520px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font:500 14.5px/1.4 var(--font-body);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.loading{padding:90px 0;text-align:center;color:var(--muted);font:500 16px/1.4 var(--font-body)}

/* Stato dell'account e backup */
.status{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:62px;padding:12px 14px;
  border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
}
.status .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.status-text{flex:1;min-width:0;font:600 15px/1.3 var(--font-body)}
.status-text small{display:block;margin-top:2px;font:400 13.5px/1.4 var(--font-body);color:var(--muted);overflow-wrap:anywhere}
.status--warn{background:var(--no-soft);border-color:transparent;margin-bottom:14px}
.status--warn .dot{background:var(--no)}
.status--warn small{color:var(--ink);opacity:.85}
.sub{margin:0 0 6px;color:var(--muted);font:400 15px/1.5 var(--font-body);overflow-wrap:anywhere}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.panel>p{margin:0 0 12px;font:400 15px/1.5 var(--font-body)}
.textarea{min-height:112px;padding:12px 14px;resize:vertical;line-height:1.4}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}

   
/* Avviso appello contemporaneo: grande, centrale e lampeggiante */
#liveWarn {
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 36px);
  max-width: 520px;
  box-sizing: border-box;
  margin: 0;
  padding: 25px 20px;
  background: var(--surface);
  color: var(--ink);
  border: 4px solid #e00000;
  border-radius: 18px;
  text-align: center;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.5;
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.45);
  animation: liveWarnFlash 0.8s infinite;
}

#liveWarn[hidden] {
  display: none !important;
}

@keyframes liveWarnFlash {
  0%, 100% {
    border-color: #e00000;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.45), 0 0 12px #e00000;
  }
  50% {
    border-color: #ff7777;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.45), 0 0 25px #ff0000;
  }
}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

   google: true  -> mostra "Continua con Google" (prima fai il passo G della guida).
   apple:  false -> metti true SOLO dopo aver fatto il passo H (serve l'Apple Developer Program). */

<script>
(function(){
'use strict';

/* ---------- utilità ---------- */
var app = document.getElementById('app');
var toastEl = document.getElementById('toast');
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clean(s){ return String(s || '').replace(/\s+/g,' ').trim(); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function plural(n, one, many){ return n === 1 ? '1 ' + one : n + ' ' + many; }
function clone(x){ return JSON.parse(JSON.stringify(x)); }

var fmtDay = new Intl.DateTimeFormat('it-IT', { weekday:'long', day:'numeric', month:'long' });
var fmtDayShort = new Intl.DateTimeFormat('it-IT', { weekday:'short', day:'numeric', month:'short' });
var fmtTime = new Intl.DateTimeFormat('it-IT', { hour:'2-digit', minute:'2-digit' });
function stamp(iso){ var d = new Date(iso); return fmtDayShort.format(d) + ' · ' + fmtTime.format(d); }

function svg(inner, size){
  var s = size || 24;
  return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
}

function isConfigured(c){
  return !!c && ['apiKey','projectId'].every(function(k){ return c[k] && String(c[k]).indexOf('INCOLLA') === -1; });
}

var LS_KEY = 'registro-presenze-v1';          // usato solo se Firebase non è configurato

/* ---------- salvataggio: solo su questo dispositivo ---------- */
function readLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var d = JSON.parse(raw);
      return { groups: Array.isArray(d.groups) ? d.groups : [], records: Array.isArray(d.records) ? d.records : [] };
    }
  }catch(e){}
  return { groups: [], records: [] };
}
function writeLocal(){
  localStorage.setItem(LS_KEY, JSON.stringify({ groups: state.groups, records: state.records }));
}
var localStore = {
  mode: 'local',
  load: function(){ return Promise.resolve(readLocal()); },
  saveGroups: function(){ writeLocal(); return Promise.resolve('ok'); },
  saveRecord: function(){ writeLocal(); return Promise.resolve('ok'); }
};

/* ---------- salvataggio: online (Firebase) ---------- */
/* Attende la conferma del server. Se la connessione è lenta o assente e la memoria
   del dispositivo è attiva, la modifica resta in coda e parte da sola appena torna internet. */
function ack(promise){
  return new Promise(function(resolve, reject){
    var done = false;
    var t = setTimeout(function(){
      if(done) return; done = true;
      if(persistOk){ resolve('queued'); } else { reject(new Error('timeout')); }
    }, 5000);
    promise.then(function(){
      if(done) return; done = true; clearTimeout(t); resolve('ok');
    }, function(err){
      if(done) return; done = true; clearTimeout(t); reject(err);
    });
  });
}
function makeCloud(userId){
  var userDoc = db.collection('utenti').doc(userId);
  var recs = userDoc.collection('appelli');
  return {
    mode: 'cloud',
    load: function(){
      return Promise.all([ userDoc.get(), recs.orderBy('at','desc').limit(500).get() ]).then(function(res){
        var gd = res[0].exists ? res[0].data() : null;
        var groups = gd && Array.isArray(gd.groups) ? clone(gd.groups) : [];
        var records = res[1].docs.map(function(d){ return clone(d.data()); });
        return { groups: groups, records: records };
      });
    },
    saveGroups: function(groups){ return ack(userDoc.set({ groups: groups })); },
    saveRecord: function(rec){ return ack(recs.doc(rec.id).set(rec)); }
  };
}
var QUEUED_MSG = 'Salvato sul dispositivo: si sincronizzerà online appena c’è connessione.';

var saving = false, again = false;
function flushGroups(){
  if(saving){ again = true; return; }
  saving = true;
  (function loop(){
    again = false;
    var p;
    try{ p = Promise.resolve(store.saveGroups(state.groups)); }catch(e){ p = Promise.reject(e); }
    p.then(function(res){
      if(res === 'queued') toast(QUEUED_MSG);
      if(again){ loop(); } else { saving = false; }
    }, function(){
      saving = false;
      toast('Non sono riuscito a salvare le modifiche. Riprova tra poco.');
    });
  })();
}

var toastTimer = null;
function toast(msg){
  toastEl.firstElementChild.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 4200);
}
var sheetEl = null;
function closeSheet(){ if(sheetEl){ sheetEl.remove(); sheetEl = null; } }
function askConfirm(o){
  closeSheet();
  var el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">' +
    '<h2 id="sheetT">' + esc(o.title) + '</h2><p>' + esc(o.text) + '</p>' +
    '<div class="sheet-actions"><button type="button" class="btn btn-quiet" data-s="no">Annulla</button>' +
    '<button type="button" class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-s="yes">' + esc(o.yes) + '</button></div></div>';
  el.addEventListener('click', function(e){
    var b = e.target.closest('[data-s]');
    if(b && b.dataset.s === 'yes'){ closeSheet(); o.onYes(); }
    else if((b && b.dataset.s === 'no') || e.target === el){ closeSheet(); }
  });
  document.body.appendChild(el);
  sheetEl = el;
  el.querySelector('[data-s="no"]').focus();
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });

function setHash(view, replace){
  try{
    if(location.hash === '#' + view) return;
    if(replace && history.replaceState){ history.replaceState(null, '', '#' + view); }
    else { location.hash = view; }
  }catch(e){}
}
function go(view, replace){
  cur.view = view;
  setHash(view, replace);
  paint();
}
function paint(){
  closeSheet();
  VIEWS[cur.view]();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', function(){
  if(!ready || !store) return;
  var v = (location.hash || '').slice(1);
  if(!VIEWS[v] || v === cur.view || OPEN_VIEWS[v]) return;
  cur.view = v;
  paint();
});

function authNote(text, isErr){
  var m = document.getElementById('authMsg');
  if(m){ m.className = 'msg ' + (isErr ? 'err' : 'good'); m.textContent = text; }
}
function submitAuth(rawEmail, pass){
  var email = clean(rawEmail);
  var signup = cur.authMode === 'signup';
  cur.authEmail = email;
  if(!email){ authNote('Scrivi la tua email.', true); document.getElementById('authEmail').focus(); return; }
  if(!pass){ authNote('Scrivi la password.', true); document.getElementById('authPass').focus(); return; }
  if(signup && pass.length < 6){ authNote('La password deve avere almeno 6 caratteri.', true); document.getElementById('authPass').focus(); return; }
  var btn = document.getElementById('btnAuth');
  btn.disabled = true; btn.textContent = signup ? 'Creo l’account…' : 'Accedo…';
  authNote('', false);
  var p;
  try{
    p = signup ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass);
  }catch(e){ p = Promise.reject(e); }
  p.then(function(){
    /* il resto lo fa onAuthStateChanged */
  }, function(e){
    var b = document.getElementById('btnAuth');
    if(b){ b.disabled = false; b.textContent = signup ? 'Crea account' : 'Accedi'; }
    authNote(authError(e), true);
  });
}
function forgotPassword(){
  var email = clean(document.getElementById('authEmail').value);
  cur.authEmail = email;
  if(!email){ authNote('Scrivi qui sopra la tua email, poi tocca di nuovo “Password dimenticata?”.', true); document.getElementById('authEmail').focus(); return; }
  authNote('Invio il messaggio…', false);
  var p;
  try{ p = auth.sendPasswordResetEmail(email); }catch(e){ p = Promise.reject(e); }
  p.then(function(){
    authNote('Se esiste un account con questa email, riceverai un messaggio per scegliere una nuova password. Controlla anche lo spam.', false);
  }, function(e){
    if(e && e.code === 'auth/user-not-found'){
      authNote('Se esiste un account con questa email, riceverai un messaggio per scegliere una nuova password. Controlla anche lo spam.', false);
    } else { authNote(authError(e), true); }
  });
}
/* Accesso con Google / Apple (finestra di accesso del provider) */
var pendingLink = null;   // metodo da collegare dopo che l'utente ha provato ad entrare con un account già esistente
function socialLogin(kind){
  if(!auth) return;
  var provider;
  try{
    if(kind === 'apple'){
      provider = new firebase.auth.OAuthProvider('apple.com');
      provider.addScope('email'); provider.addScope('name');
    } else {
      provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt:'select_account' });
    }
  }catch(e){ authNote(authError(e, kind), true); return; }
  authNote(kind === 'apple' ? 'Apro la finestra di Apple…' : 'Apro la finestra di Google…', false);
  var p;
  try{ p = auth.signInWithPopup(provider); }catch(e){ p = Promise.reject(e); }
  p.then(function(){
    /* il resto lo fa onAuthStateChanged */
  }, function(e){
    var c = e && e.code;
    if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request'){ authNote('', false); return; }
    if(c === 'auth/account-exists-with-different-credential'){
      var mail = (e.customData && e.customData.email) || e.email || '';
      pendingLink = e.credential ? { email: mail, credential: e.credential } : null;
      cur.authMode = 'login'; cur.authEmail = mail; paint();
      authNote('Esiste già un account con questa email, creato in un altro modo. Entra qui sotto con quello (email e password, Google o Apple): poi collego anche questo metodo.', true);
      return;
    }
    authNote(authError(e, kind), true);
  });
}
function doLogout(){
  var p;
  try{ p = Promise.resolve(auth.signOut()); }catch(e){ p = Promise.reject(e); }
  p.then(null, function(){ toast('Non sono riuscito a uscire. Riprova.'); });
}
function askLogout(){
  Promise.race([
    Promise.resolve(db.waitForPendingWrites()).then(function(){ return true; }),
    sleep(1500).then(function(){ return false; })
  ]).catch(function(){ return true; }).then(function(synced){
    askConfirm({
      title:'Uscire dall’account?',
      text: synced
        ? 'I tuoi dati restano salvati online. Per ritrovarli ti servono email e password.'
        : 'Alcune modifiche non sono ancora arrivate online (forse sei senza connessione). Se esci adesso potresti perderle.',
      yes: synced ? 'Esci' : 'Esci comunque', danger:true, onYes:doLogout
    });
  });
}

/* ---------- sessione ---------- */
function startSession(user){
  acct.name = user.displayName || user.email || '';
  var cloud = makeCloud(user.uid);
  var attempt = function(){
    showLoading('Carico i tuoi dati…');
    Promise.race([ cloud.load(), sleep(15000).then(function(){ throw { code:'timeout' }; }) ]).then(function(data){
      if(sessionUid !== user.uid) return;
      store = cloud; state = data; ready = true;
      go('home', true);
    }, function(err){
      if(sessionUid !== user.uid) return;
      var denied = err && err.code === 'permission-denied';
      cur.error = {
        title: denied ? 'Il database non ha dato il permesso' : 'Non riesco a caricare i dati',
        text: denied ? 'Le regole di Firestore non sono state pubblicate o non sono corrette. Controlla il passo A4 della guida.'
                     : 'Controlla la connessione a internet e riprova. I dati che hai già salvato non si perdono.',
        logout: true
      };
      retryFn = attempt;
      go('errore', true);
    });
  };
  attempt();
}
function endSession(){
  sessionUid = null; store = null; retryFn = null;
  state = { groups: [], records: [] };
  acct = { name: '' };
  cur.groupId = null; cur.marks = null; cur.last = null; cur.flash = ''; cur.authMode = 'login'; cur.error = null;
  ready = true;
  go('accesso', true);
}
function onUser(user){
  if(user){
    if(pendingLink){
      var pl = pendingLink; pendingLink = null;
      if(user.email && pl.email && user.email.toLowerCase() === pl.email.toLowerCase()){
        user.linkWithCredential(pl.credential).then(function(){
          toast('Nuovo metodo di accesso collegato al tuo account.');
        }, function(){
          toast('Non sono riuscito a collegare il nuovo metodo di accesso.');
        });
      }
    }
    if(sessionUid === user.uid) return;
    sessionUid = user.uid;
    startSession(user);
  } else {
    endSession();
  }
}

      return '<li class="row call-row" data-id="' + m.id + '"><span class="num">' + (i + 1) + '</span><span class="who">' + esc(m.name) + '</span>' +
        '<div class="seg" role="group" aria-label="Presenza di ' + esc(m.name) + '">' +
        '<button type="button" class="on-ok" data-act="mark" data-id="' + m.id + '" data-v="1" aria-pressed="false">Presente</button>' +
        '<button type="button" class="on-no" data-act="mark" data-id="' + m.id + '" data-v="0" aria-pressed="false">Assente</button></div></li>';
    }).join('') + '</ol>' +
    '<p class="msg" id="callMsg" role="status"></p>' +
    '<button class="btn btn-primary btn-block" id="btnConfirm" type="button" data-act="confirm-call">Conferma appello</button></div>';
  paintCall();
};
function paintCall(){
  var g = findGroup(); if(!g) return;
  var yes = 0, no = 0;
  g.members.forEach(function(m){
    var v = cur.marks[m.id];
    if(v === true) yes++; else if(v === false) no++;
    var row = app.querySelector('.call-row[data-id="' + m.id + '"]');
    if(!row) return;
    var b = row.querySelectorAll('.seg button');
    b[0].setAttribute('aria-pressed', v === true ? 'true' : 'false');
    b[1].setAttribute('aria-pressed', v === false ? 'true' : 'false');
    if(v !== undefined) row.classList.remove('missing');
  });
  var left = g.members.length - yes - no;
  document.getElementById('tally').innerHTML =
    '<span class="chip chip--ok"><b>' + yes + '</b> presenti</span>' +
    '<span class="chip chip--no"><b>' + no + '</b> assenti</span>' +
    '<span class="chip"><b>' + left + '</b> da segnare</span>';
}
function confirmCall(){
  var g = findGroup(); if(!g || !cur.marks) return;
  var msg = document.getElementById('callMsg');
  var missing = g.members.filter(function(m){ return cur.marks[m.id] === undefined; });
  if(missing.length){
    msg.className = 'msg err';
    msg.textContent = missing.length === 1 ? 'Manca 1 persona da segnare, evidenziata qui sopra.' : 'Mancano ' + missing.length + ' persone da segnare, evidenziate qui sopra.';
    missing.forEach(function(m){
      var row = app.querySelector('.call-row[data-id="' + m.id + '"]');
      if(row) row.classList.add('missing');
    });
    var first = app.querySelector('.call-row.missing');
    if(first) first.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }
  var rec = {
    id: newId(),
    groupId: g.id,
    groupName: g.name,
    at: new Date().toISOString(),
    entries: g.members.map(function(m){ return { name: m.name, present: cur.marks[m.id] === true }; })
  };
  var btn = document.getElementById('btnConfirm');
     var title = clean(document.getElementById('callTitle').value).slice(0, 80);
  if(title) rec.title = title;
  btn.disabled = true; btn.textContent = 'Salvo…';
  msg.className = 'msg'; msg.textContent = '';
  state.records.unshift(rec);
  var p;
  try{ p = Promise.resolve(store.saveRecord(rec)); }catch(e){ p = Promise.reject(e); }
  p.then(function(res){
    cur.marks = null;
    cur.last = rec;
    go('fatto');
    if(res === 'queued') toast(QUEUED_MSG);
  }, function(){
    state.records = state.records.filter(function(r){ return r.id !== rec.id; });
    btn.disabled = false; btn.textContent = 'Conferma appello';
    msg.className = 'msg err';
    msg.textContent = store.mode === 'cloud'
      ? 'Non sono riuscito a salvare l’appello. Controlla la connessione e riprova.'
      : 'Questo browser non permette di salvare i dati. Riprova, oppure apri la pagina in Safari.';
  });
}

function backupText(){
  return JSON.stringify({ app:'registro-presenze', v:1, exportedAt:new Date().toISOString(), groups:state.groups, records:state.records }, null, 1);
}
function dlBackup(){
  var name = 'registro-presenze-' + new Date().toISOString().slice(0, 10) + '.json';
  try{
    var blob = new Blob([backupText()], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
    toast('Backup pronto.');
  }catch(e){
    toast('Non riesco a scaricare il file. Prova con “Copia backup”.');
  }
}
function copyBackup(){
  var txt = backupText();
  var box = document.getElementById('backupBox');
  var fallback = function(){ if(box){ box.value = txt; box.focus(); box.select(); } toast('Seleziona il testo qui sotto e copialo.'); };
  try{
    navigator.clipboard.writeText(txt).then(function(){ toast('Backup copiato. Incollalo in una nota per conservarlo.'); }, fallback);
  }catch(e){ fallback(); }
}
function restoreNote(text, isErr){
  var m = document.getElementById('restoreMsg');
  if(m){ m.className = 'msg ' + (isErr ? 'err' : 'good'); m.textContent = text; }
}
var ID_OK = /^[A-Za-z0-9_-]{1,64}$/;
function restoreFrom(text){
  var d;
  try{ d = JSON.parse(String(text || '').trim()); }catch(e){ restoreNote('Il testo non è un backup valido.', true); return; }
  if(!d || d.app !== 'registro-presenze' || !Array.isArray(d.groups) || !Array.isArray(d.records)){ restoreNote('Questo non sembra un backup di Registro presenze.', true); return; }
  var addG = 0, addP = 0, newRecs = [];
  d.groups.forEach(function(bg){
    if(!bg || !ID_OK.test(String(bg.id)) || typeof bg.name !== 'string' || !Array.isArray(bg.members)) return;
    var g = state.groups.filter(function(x){ return x.id === bg.id; })[0];
    if(!g){ g = { id: bg.id, name: clean(bg.name).slice(0, 60), members: [] }; state.groups.push(g); addG++; }
    bg.members.forEach(function(bm){
      if(bm && ID_OK.test(String(bm.id)) && typeof bm.name === 'string' && !g.members.some(function(x){ return x.id === bm.id; })){
        g.members.push({ id: bm.id, name: clean(bm.name).slice(0, 80) }); addP++;
      }
    });
  });
  d.records.forEach(function(r){
    if(r && ID_OK.test(String(r.id)) && typeof r.at === 'string' && Array.isArray(r.entries) && !state.records.some(function(x){ return x.id === r.id; })){
      var rec = {
        id: r.id, groupId: String(r.groupId || ''), groupName: clean(r.groupName).slice(0, 60), at: r.at,
        entries: r.entries.filter(function(e){ return e && typeof e.name === 'string'; }).map(function(e){ return { name: clean(e.name).slice(0, 80), present: e.present === true }; })
      };
            if(typeof r.title === 'string' && clean(r.title)) rec.title = clean(r.title).slice(0, 80);
      state.records.push(rec); newRecs.push(rec);

    }
  });
  state.records.sort(function(a, b){ return a.at < b.at ? 1 : -1; });
  if(!addG && !addP && !newRecs.length){ restoreNote('Il backup non contiene nulla di nuovo: i tuoi dati sono già completi.', false); return; }
  flushGroups();
  var chain = Promise.resolve();
  newRecs.forEach(function(rec){ chain = chain.then(function(){ return store.saveRecord(rec); }); });
  chain.then(function(){
    restoreNote('Ripristinato: ' + plural(addG, 'gruppo', 'gruppi') + ', ' + plural(addP, 'persona', 'persone') + ', ' + plural(newRecs.length, 'appello', 'appelli') + '.', false);
  }, function(){
    restoreNote('Ripristino incompleto: alcuni appelli non sono stati salvati. Riprova.', true);
  });
}

/* ---------- eventi ---------- */
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act, id = el.dataset.id;
  if(act === 'home'){ leaveTo('home'); }
  else if(act === 'add'){ go('nuovo-gruppo'); }
  else if(act === 'call'){ go('scegli-gruppo'); }
  else if(act === 'history'){ go('storico'); }
  else if(act === 'open-group'){ cur.groupId = id; cur.flash = ''; go('membri'); }
  else if(act === 'start-call'){ startCall(id); }
  else if(act === 'cancel-name'){
    var i = document.getElementById('memberName'), m = document.getElementById('memberMsg');
    i.value = ''; m.className = 'msg'; m.textContent = ''; i.focus();
  }
  else if(act === 'remove-member'){
    var g = findGroup(); if(!g) return;
    var mem = g.members.filter(function(x){ return x.id === id; })[0]; if(!mem) return;
    askConfirm({ title:'Rimuovere ' + mem.name + '?', text:'La persona esce dal gruppo. Gli appelli già salvati non cambiano.', yes:'Rimuovi', danger:true, onYes:function(){
      g.members = g.members.filter(function(x){ return x.id !== id; });
      flushGroups(); paintMembers();
    }});
  }
  else if(act === 'delete-group'){
    var gg = findGroup(); if(!gg) return;
    askConfirm({ title:'Eliminare “' + gg.name + '”?', text:'Il gruppo e i suoi nomi vengono cancellati. Gli appelli già salvati restano nello storico.', yes:'Elimina gruppo', danger:true, onYes:function(){
      state.groups = state.groups.filter(function(x){ return x.id !== gg.id; });
      flushGroups(); cur.groupId = null; toast('Gruppo eliminato.'); go('home');
    }});
  }
  else if(act === 'mark'){
    if(!cur.marks) return;
    var v = el.dataset.v === '1';
    if(cur.marks[id] === v){ delete cur.marks[id]; } else { cur.marks[id] = v; }
    paintCall();
  }
  else if(act === 'all-present'){
    var gr = findGroup(); if(!gr || !cur.marks) return;
    gr.members.forEach(function(x){ cur.marks[x.id] = true; });
    paintCall();
  }
  else if(act === 'confirm-call'){ confirmCall(); }
  else if(act === 'account'){ go('backup'); }
  else if(act === 'dl-backup'){ dlBackup(); }
  else if(act === 'copy-backup'){ copyBackup(); }

    cur.authMode = el.dataset.v === 'signup' ? 'signup' : 'login';
    paint();

  else if(act === 'toggle-pw'){
    var pi = document.getElementById('authPass'); if(!pi) return;
    var show = pi.type === 'password';
    pi.type = show ? 'text' : 'password';
    el.textContent = show ? 'Nascondi' : 'Mostra';
    el.setAttribute('aria-pressed', show ? 'true' : 'false');
    pi.focus();
  }
  else if(act === 'auth-forgot'){ forgotPassword(); }
  else if(act === 'social'){ socialLogin(el.dataset.v); }
  else if(act === 'logout'){ askLogout(); }
  else if(act === 'logout-now'){ doLogout(); }
  else if(act === 'retry'){ if(retryFn){ retryFn(); } else { location.reload(); } }
});

function boot(){
  if(!CONFIGURED){ startLocal(); return; }
  if(!(window.firebase && firebase.auth && firebase.firestore)){
    sdkProblem('Non riesco a collegarmi', 'Il servizio di accesso non si è caricato. Controlla la connessione a internet e riprova.');
    return;
  }
  showLoading('Carico…');
  try{

    db = firebase.firestore();
  }catch(e){
    sdkProblem('Configurazione non valida', 'I dati di Firebase in index.html non sono corretti. Controlla il passo B della guida.');
    return;
  }
  /* memoria del dispositivo: permette di lavorare anche con poca o nessuna connessione */
  var persist;
  try{
    persist = Promise.race([
      db.enablePersistence({ synchronizeTabs:true }).then(function(){ persistOk = true; }),
      sleep(4000)
    ]).catch(function(){ persistOk = false; });
  }catch(e){ persist = Promise.resolve(); }
  persist.then(function(){
    auth.onAuthStateChanged(onUser, function(){
      sdkProblem('Non riesco a collegarmi', 'Il servizio di accesso non risponde. Controlla la connessione a internet e riprova.');
    });
  });
}

ICON.users = svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.2 6-5.2s6 2 6 5.2"/><circle cx="17" cy="9" r="2.5"/><path d="M17.6 14.2c2.1.3 3.7 1.9 3.7 4.3"/>', 22);

var sh = { groups: Object.create(null), uid: null, unsubIndex: null, presRef: null, presTimer: null, presGid: null, warned: false, dismissed: false };

/* ---------- elenchi che uniscono gruppi personali e condivisi ---------- */
function sharedReady(){
  var out = [];
  Object.keys(sh.groups).forEach(function(id){ if(sh.groups[id].ready) out.push(sh.groups[id]); });
  out.sort(function(a, b){ return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
  return out;
}
function allGroups(){
  return state.groups.filter(function(x){ return !sh.groups[x.id]; }).concat(sharedReady());
}
function allRecords(){
  var out = state.records.filter(function(r){ return !sh.groups[r.groupId]; });
  sharedReady().forEach(function(g){ out = out.concat(g.recs); });
  out.sort(function(a, b){ return a.at < b.at ? 1 : -1; });
  return out;
}
function findGroup(){
  var s = sh.groups[cur.groupId];
  if(s && s.ready) return s;
  for(var i = 0; i < state.groups.length; i++){ if(state.groups[i].id === cur.groupId) return state.groups[i]; }
  return null;
}
function canEditGroup(g){ return !g.shared || g.role === 'owner'; }
function ownersCount(g){ return g.staff.filter(function(x){ return x.role === 'owner'; }).length; }
function sig(g){ return g.members.map(function(m){ return m.id; }).join(','); }

/* ---------- schermata ridisegnata da sola quando arrivano modifiche ---------- */
function repaint(){
  var y = window.scrollY || 0;
  var opened = [].slice.call(app.querySelectorAll('details[open]')).map(function(d){ return d.dataset.rid; });
  VIEWS[cur.view]();
  opened.forEach(function(id){
    var d = app.querySelector('details[data-rid="' + id + '"]');
    if(d) d.open = true;
  });
  window.scrollTo(0, y);
}
function refreshCall(){

  var v = t ? t.value : '';
  VIEWS.appello();

  if(t2) t2.value = v;

}
function liveRefresh(){
  if(!store || store.mode !== 'cloud') return;
  var v = cur.view, g;
  if(v === 'home' || v === 'scegli-gruppo' || v === 'storico' || v === 'condividi'){ repaint(); }
  else if(v === 'membri'){
    g = findGroup();
    if(!g){ go('home'); }
    else if(g.shared && cur.roleSeen !== g.role){ repaint(); }
    else { paintMembers(); }
  }
  else if(v === 'appello'){
    g = findGroup();
    if(!g){ cur.marks = null; go('home'); return; }
    if(g.shared){
      if(cur.callSig !== sig(g)){ refreshCall(); }
      paintPresence();
    }
  }
}

/* ---------- collegamento ai gruppi condivisi (in diretta) ---------- */
function startShared(user){
  stopShared();
  sh.uid = user.uid;
  sh.unsubIndex = db.collection('utenti').doc(user.uid).collection('condivisi').onSnapshot(function(snap){
    var ids = {};
    snap.docs.forEach(function(d){ ids[d.id] = true; });
    Object.keys(ids).forEach(function(id){ if(!sh.groups[id]) attachGroup(id); });
    Object.keys(sh.groups).forEach(function(id){ if(!ids[id]) detachGroup(id); });
    liveRefresh();
  }, function(){ /* regole non ancora aggiornate: nessun gruppo condiviso */ });
}
function stopShared(){
  stopPresence();
  if(sh.unsubIndex){ try{ sh.unsubIndex(); }catch(e){} }
  Object.keys(sh.groups).forEach(function(id){
    sh.groups[id].unsubs.forEach(function(u){ try{ u(); }catch(e){} });
  });
  sh = { groups: Object.create(null), uid: null, unsubIndex: null, presRef: null, presTimer: null, presGid: null, warned: false, dismissed: false };
}
function attachGroup(id){
  var g = { id:id, name:'', members:[], shared:true, role:null, staff:[], recs:[], live:[], ready:false, got:{ g:false, m:false }, unsubs:[], leaving:false };
  sh.groups[id] = g;
  var gref = db.collection('gruppi').doc(id);
  var alive = function(){ return sh.groups[id] === g; };
  var onErr = function(err){ if(alive() && err && err.code === 'permission-denied') lostGroup(id); };
  var ready = function(){
    if(g.got.g && g.got.m){ g.ready = true; }
    liveRefresh();
  };
  g.unsubs.push(gref.onSnapshot(function(s){
    if(!alive()) return;
    if(!s.exists){ lostGroup(id); return; }
    var d = s.data();
    g.name = d.name || '';
    g.members = Array.isArray(d.people) ? clone(d.people) : [];
    g.got.g = true; ready();
  }, onErr));
  g.unsubs.push(gref.collection('membri').onSnapshot(function(s){
    if(!alive()) return;
    g.staff = s.docs.map(function(d){ return clone(d.data()); });
    var mine = g.staff.filter(function(x){ return x.uid === sh.uid; })[0];
    if(!mine){ lostGroup(id); return; }
    g.role = mine.role;
    g.got.m = true; ready();
  }, onErr));
  g.unsubs.push(gref.collection('appelli').orderBy('at', 'desc').limit(300).onSnapshot(function(s){
    if(!alive()) return;
    g.recs = s.docs.map(function(d){ return clone(d.data()); });
    liveRefresh();
  }, onErr));
  g.unsubs.push(gref.collection('live').onSnapshot(function(s){
    if(!alive()) return;
    g.live = s.docs.map(function(d){ return clone(d.data()); });
    paintPresence();
  }, onErr));
}
function detachGroup(id){
  var g = sh.groups[id]; if(!g) return;
  g.unsubs.forEach(function(u){ try{ u(); }catch(e){} });
  if(sh.presGid === id) stopPresence();
  delete sh.groups[id];
  state.records = state.records.filter(function(r){ return r.groupId !== id; });
}
/* il gruppo non c'è più, oppure non ne faccio più parte */
function lostGroup(id){
  var g = sh.groups[id]; if(!g) return;
  var name = g.name, quiet = g.leaving;
  detachGroup(id);
  try{
    db.collection('utenti').doc(sh.uid).collection('condivisi').doc(id).delete().catch(function(){});
  }catch(e){}
  if(cur.groupId === id){ cur.groupId = null; cur.marks = null; }
  if(!quiet) toast('Non hai più accesso al gruppo' + (name ? ' “' + name + '”' : '') + '.');
  liveRefresh();
}

/* ---------- avviso: due persone fanno l'appello insieme ---------- */
function otherLive(g){
  return g.live.filter(function(x){ return x.uid !== sh.uid && Date.now() - x.at < 120000; });
}
function startPresence(g){
  if(sh.presGid === g.id) return;
  stopPresence();
  sh.presGid = g.id; sh.warned = false; sh.dismissed = false;
  var ref = db.collection('gruppi').doc(g.id).collection('live').doc(sh.uid);
  var beat = function(){
    try{ Promise.resolve(ref.set({ uid: sh.uid, label: acct.name, at: Date.now() })).catch(function(){}); }catch(e){}
    paintPresence();
  };
  sh.presRef = ref;
  beat();
  sh.presTimer = setInterval(beat, 30000);
}
function stopPresence(){
  if(sh.presTimer){ clearInterval(sh.presTimer); sh.presTimer = null; }
  if(sh.presRef){
    try{ Promise.resolve(sh.presRef.delete()).catch(function(){}); }catch(e){}
    sh.presRef = null;
  }
  sh.presGid = null; sh.warned = false; sh.dismissed = false;
}
function syncPresence(){
  var g = cur.view === 'appello' && cur.marks ? findGroup() : null;
  if(g && g.shared) startPresence(g); else stopPresence();
}
function paintPresence(){
  if(cur.view !== 'appello') return;
  var g = findGroup();
  var box = document.getElementById('liveWarn');
  var textEl = document.getElementById('liveWarnText');
  if(!g || !g.shared || !box || !textEl) return;
  var o = otherLive(g);
  if(!o.length){
    box.hidden = true;
    textEl.textContent = '';
    sh.warned = false;
    sh.dismissed = false;
    return;
  }
  var names = o.map(function(x){ return x.label || 'Un’altra persona'; }).join(', ');
  textEl.textContent = names + (o.length === 1 ? ' sta' : ' stanno') + ' facendo l’appello di questo gruppo in questo momento. ' +
    'Ci sono più appelli in corso: mettetevi d’accordo per non registrare due volte la stessa lezione.';
  box.hidden = sh.dismissed;
  if(!sh.warned){ sh.warned = true; toast('Due persone stanno facendo l’appello su questo gruppo.'); }
}
window.addEventListener('pagehide', function(){ stopPresence(); });

VIEWS.unisciti = function(){
  app.innerHTML = header('Condivisione', 'Unisciti a un gruppo') +
    '<div class="screen"><p class="lead">Scrivi il codice di invito che ti ha dato il proprietario del gruppo.</p>' +
    '<form id="formJoin" novalidate><div class="field"><label class="label" for="joinCode">Codice di invito</label>' +
    '<input class="input" id="joinCode" name="code" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="14" enterkeyhint="go" placeholder="XXXXX-XXXXX"></div>' +
    '<p class="msg" id="joinMsg" role="status"></p>' +
    '<button class="btn btn-primary btn-block" id="btnJoin" type="submit">Unisciti</button></form></div>';
  var f = document.getElementById('joinCode'); if(f) f.focus();
};
function joinNote(text, isErr){
  var m = document.getElementById('joinMsg');
  if(m){ m.className = 'msg ' + (isErr ? 'err' : 'good'); m.textContent = text; }
}
function withTimeout(p, ms){
  return Promise.race([ Promise.resolve(p), sleep(ms || 15000).then(function(){ throw { code:'timeout' }; }) ]);
}
function joinGroup(raw){
  var code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 10){ joinNote('Il codice ha 10 tra lettere e numeri. Controlla e riprova.', true); return; }
  var btn = document.getElementById('btnJoin');
  btn.disabled = true; btn.textContent = 'Controllo…';
  joinNote('', false);
  var info, memberRef;
  withTimeout(db.collection('inviti').doc(code).get()).then(function(s){
    if(!s.exists) throw { code:'x-invalid' };
    info = s.data();
    if(!info || typeof info.gid !== 'string' || !info.gid) throw { code:'x-invalid' };
    if(info.scade && info.scade.toMillis && info.scade.toMillis() < Date.now()) throw { code:'x-expired' };
    if(sh.groups[info.gid]) throw { code:'x-already' };
    var gref = db.collection('gruppi').doc(info.gid);
    memberRef = gref.collection('membri').doc(sh.uid);
    return withTimeout(memberRef.set({ uid: sh.uid, role:'member', label: acct.name, codice: code, at: Date.now() }));
  }).then(function(){
    return withTimeout(db.collection('utenti').doc(sh.uid).collection('condivisi').doc(info.gid).set({ gid: info.gid, at: Date.now() })).catch(function(e){
      return memberRef.delete().catch(function(){}).then(function(){ throw e; });
    });
  }).then(function(){
    toast('Ora fai parte del gruppo “' + info.groupName + '”.');
    go('home');
  }, function(e){
    var b = document.getElementById('btnJoin');
    if(b){ b.disabled = false; b.textContent = 'Unisciti'; }
    var c = e && e.code;
    joinNote(
      c === 'x-invalid' ? 'Codice non trovato. Controlla di averlo scritto bene.' :
      c === 'x-expired' ? 'Questo codice è scaduto. Chiedi al proprietario di crearne uno nuovo.' :
      c === 'x-already' ? 'Fai già parte di questo gruppo.' :
      c === 'permission-denied' ? 'Non è stato possibile usare questo codice: potrebbe essere scaduto o annullato.' :
      'Non sono riuscito a completare l’operazione. Controlla la connessione e riprova.', true);
  });
}

/* ---------- persone con accesso, inviti, uscita ---------- */
function makeCode(){
  var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '', buf = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for(var i = 0; i < 10; i++) out += A.charAt(buf[i] % A.length);
  return out;
}
function showCode(c){ return c.slice(0, 5) + '-' + c.slice(5); }

VIEWS.condividi = function(){
  var g = findGroup();
  if(!g || !g.shared){ go('home'); return; }
  var owner = g.role === 'owner';
  var nOwn = ownersCount(g);
  var staff = g.staff.slice().sort(function(a, b){
    if(a.role !== b.role) return a.role === 'owner' ? -1 : 1;
    return String(a.label || '').toLowerCase() < String(b.label || '').toLowerCase() ? -1 : 1;
  });
  var rows = staff.map(function(x){
    var me = x.uid === sh.uid;
    var acts = '';
    if(owner){
      if(x.role === 'member'){
        acts = '<button class="link-btn" type="button" data-act="sh-promote" data-id="' + esc(x.uid) + '">Rendi proprietario</button>' +
               '<button class="link-btn danger" type="button" data-act="sh-kick" data-id="' + esc(x.uid) + '">Rimuovi</button>';
      } else if(nOwn > 1 && !me){
        acts = '<button class="link-btn danger" type="button" data-act="sh-demote" data-id="' + esc(x.uid) + '">Togli proprietà</button>';
      }
    }
    return '<li class="row"><span class="who">' + esc(x.label || 'Utente') + (me ? ' (tu)' : '') +
      '<small>' + (x.role === 'owner' ? 'Proprietario: gestisce persone e gruppo' : 'Fa gli appelli') + '</small></span>' +
      (acts ? '<span class="x-actions">' + acts + '</span>' : '') + '</li>';
  }).join('');
  var inv = cur.invite && cur.invite.gid === g.id && cur.invite.scade > Date.now() ? cur.invite : null;
  var invite = '';
  if(owner){
    invite = '<h2 class="h2">Invita una persona</h2><div class="panel"><p>Crea un codice e mandalo alla persona: lo scrive da <b>Home → Unisciti a un gruppo</b> con il suo account. ' +
      'Chi entra potrà solo fare l’appello. Il codice vale 7 giorni e funziona per chiunque lo riceva.</p>' +
      (inv ? '<div class="codebox"><strong>' + esc(showCode(inv.code)) + '</strong><small>Valido fino al ' + esc(fmtDayShort.format(new Date(inv.scade))) + '</small></div>' +
             '<div class="stack-s"><button class="btn btn-primary btn-block" type="button" data-act="sh-copy">Copia il codice</button>' +
             '<button class="btn btn-quiet btn-block" type="button" data-act="sh-invite">Crea un nuovo codice</button>' +
             '<button class="link-btn danger" type="button" data-act="sh-revoke">Annulla questo codice</button></div>'
           : '<button class="btn btn-primary btn-block" type="button" data-act="sh-invite">Crea codice di invito</button>') +
      '</div>';
  }
  var leave = owner
    ? '<p class="sub" style="margin-top:26px">' + (nOwn < 2
        ? 'Sei l’unico proprietario: nomina prima un altro proprietario, oppure elimina il gruppo dalla schermata delle persone.'
        : 'Per uscire, chiedi a un altro proprietario di toglierti la proprietà. Dopo potrai lasciare il gruppo come membro.') + '</p>'
    : '<div style="margin-top:26px;text-align:center"><button class="link-btn danger" type="button" data-act="sh-leave">Esci da questo gruppo</button></div>';
  app.innerHTML = header('Gruppo condiviso', g.name) +
    '<div class="screen"><p class="lead">' + (owner ? 'Sei proprietario di questo gruppo.' : 'Puoi fare gli appelli e vedere lo storico. Le modifiche spettano ai proprietari.') + '</p>' +
    '<h2 class="h2" style="margin-top:8px">Persone con accesso · ' + staff.length + '</h2><ul class="list">' + rows + '</ul>' +
    invite + leave +
    '<div style="margin-top:18px"><button class="btn btn-quiet btn-block" type="button" data-act="sh-back">Torna alle persone del gruppo</button></div></div>';
};

function runOp(p, okMsg){
  Promise.resolve(p).then(function(){ if(okMsg) toast(okMsg); }, function(){ toast('Operazione non riuscita. Riprova.'); });
}
function changeStaff(g, act, uid){
  var m = g.staff.filter(function(x){ return x.uid === uid; })[0]; if(!m) return;
  var ref = db.collection('gruppi').doc(g.id).collection('membri').doc(uid);
  var name = m.label || 'questa persona';
  if(act === 'sh-promote'){
    askConfirm({ title:'Rendere ' + name + ' proprietario?', text:'Potrà modificare le persone del gruppo, invitare altri, nominare altri proprietari ed eliminare il gruppo.', yes:'Rendi proprietario', onYes:function(){
      runOp(ref.update({ role:'owner' }), 'Ora ' + name + ' è proprietario.');
    }});
  } else if(act === 'sh-demote'){
    if(ownersCount(g) < 2) return;
    askConfirm({ title:'Togliere la proprietà a ' + name + '?', text:'Potrà solo fare gli appelli e vedere lo storico.', yes:'Togli proprietà', danger:true, onYes:function(){
      runOp(ref.update({ role:'member' }), 'Fatto.');
    }});
  } else if(act === 'sh-kick'){
    if(m.role === 'owner') return;
    askConfirm({ title:'Rimuovere ' + name + ' dal gruppo?', text:'Non potrà più vedere il gruppo né fare appelli. Gli appelli già salvati restano nello storico.', yes:'Rimuovi', danger:true, onYes:function(){
      runOp(ref.delete(), name + ' è stato rimosso.');
    }});
  }
}
function createInvite(g){
  var code = makeCode(), ms = Date.now() + 7 * 24 * 3600 * 1000;
  withTimeout(db.collection('inviti').doc(code).set({ gid:g.id, groupName:g.name, createdBy:sh.uid, scade: firebase.firestore.Timestamp.fromMillis(ms) })).then(function(){
    cur.invite = { gid:g.id, code:code, scade:ms };
    if(cur.view === 'condividi') repaint();
  }, function(){ toast('Non sono riuscito a creare il codice. Controlla la connessione.'); });
}
function revokeInvite(g){
  if(!cur.invite || !g || cur.invite.gid !== g.id) return;
  var code = cur.invite.code;
  Promise.resolve(db.collection('inviti').doc(code).delete()).then(function(){
    cur.invite = null; toast('Codice annullato.');
    if(cur.view === 'condividi') repaint();
  }, function(){ toast('Non sono riuscito ad annullare il codice. Riprova.'); });
}
function copyCode(){
  if(!cur.invite) return;
  var txt = showCode(cur.invite.code);
  try{
    navigator.clipboard.writeText(txt).then(function(){ toast('Codice copiato.'); }, function(){ toast('Tieni premuto sul codice per copiarlo.'); });
  }catch(e){ toast('Tieni premuto sul codice per copiarlo.'); }
}
function askLeave(g){
  if(g.role === 'owner'){
    toast(ownersCount(g) < 2
      ? 'Sei l’unico proprietario: nomina prima un altro proprietario oppure elimina il gruppo.'
      : 'Chiedi a un altro proprietario di toglierti la proprietà, poi potrai uscire come membro.');
    return;
  }
  askConfirm({ title:'Uscire dal gruppo “' + g.name + '”?', text:'Non lo vedrai più. Per rientrare servirà un nuovo codice di invito.', yes:'Esci dal gruppo', danger:true, onYes:function(){
    g.leaving = true;
    withTimeout(db.collection('gruppi').doc(g.id).collection('membri').doc(sh.uid).delete()).then(function(){
      return db.collection('utenti').doc(sh.uid).collection('condivisi').doc(g.id).delete();
    }).then(function(){
      toast('Sei uscito dal gruppo.');
      cur.groupId = null; go('home');
    }, function(){ g.leaving = false; toast('Non sono riuscito a uscire dal gruppo. Riprova.'); });
  }});
}

/* ---------- modifiche alle persone di un gruppo condiviso (solo proprietari) ---------- */
function sharedAddPerson(g, raw){
  if(g.role !== 'owner') return;
  var name = clean(raw);
  var msg = document.getElementById('memberMsg');
  var input = document.getElementById('memberName');
  if(!name){ msg.className = 'msg err'; msg.textContent = 'Scrivi un nome prima di premere Invia.'; input.focus(); return; }
  var dup = g.members.some(function(m){ return m.name.toLowerCase() === name.toLowerCase(); });
  if(dup){ msg.className = 'msg err'; msg.textContent = 'C’è già una persona con questo nome. Aggiungi il cognome o un’iniziale.'; input.focus(); return; }
  ack(db.collection('gruppi').doc(g.id).update({ people: firebase.firestore.FieldValue.arrayUnion({ id: newId(), name: name }) })).then(function(res){
    if(res === 'queued') toast(QUEUED_MSG);
  }, function(){ toast('Non sono riuscito a salvare le modifiche. Riprova tra poco.'); });
  input.value = '';
  msg.className = 'msg good';
  msg.textContent = 'Aggiunto: ' + name;
  input.focus();
}
function sharedRemovePerson(g, id){
  if(g.role !== 'owner') return;
  var mem = g.members.filter(function(x){ return x.id === id; })[0]; if(!mem) return;
  askConfirm({ title:'Rimuovere ' + mem.name + '?', text:'La persona esce dal gruppo. Gli appelli già salvati non cambiano.', yes:'Rimuovi', danger:true, onYes:function(){
    ack(db.collection('gruppi').doc(g.id).update({ people: firebase.firestore.FieldValue.arrayRemove(mem) })).then(function(res){
      if(res === 'queued') toast(QUEUED_MSG);
    }, function(){ toast('Non sono riuscito a salvare le modifiche. Riprova tra poco.'); });
  }});
}

/* ---------- da gruppo personale a gruppo condiviso ---------- */
function shareGroup(g){
  askConfirm({ title:'Condividere “' + g.name + '”?', text:'Il gruppo, le persone e lo storico dei suoi appelli passano online in uno spazio condiviso. Tu ne diventi proprietario e potrai invitare altre persone. Non si può annullare.', yes:'Condividi', onYes:function(){ doShare(g); } });
}
function chunks(arr, n){
  var out = [];
  for(var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}
function doShare(g){
  toast('Sto condividendo il gruppo…');
  var uid = sh.uid, label = acct.name, gid = g.id;
  var gref = db.collection('gruppi').doc(gid);
  var mine = state.records.filter(function(r){ return r.groupId === gid; });
  var chain = withTimeout(gref.set({ name: g.name, people: g.members, createdBy: uid, at: Date.now() }), 20000);
  chain = chain.then(function(){
    // Non ignorare permission-denied: senza membership owner il gruppo non è condiviso.
    return withTimeout(gref.collection('membri').doc(uid).set({ uid: uid, role:'owner', label: label }), 20000);
  });
  chunks(mine, 400).forEach(function(part){
    chain = chain.then(function(){
      var b = db.batch();
      part.forEach(function(r){
        var c = clone(r); c.by = uid; c.byLabel = label;
        b.set(gref.collection('appelli').doc(r.id), c);
      });
      return withTimeout(b.commit(), 20000);
    });
  });
  chain = chain.then(function(){
    return withTimeout(db.collection('utenti').doc(uid).collection('condivisi').doc(gid).set({ gid: gid, at: Date.now() }), 20000);
  });
  chunks(mine, 400).forEach(function(part){
    chain = chain.then(function(){
      var b = db.batch();
      part.forEach(function(r){ b.delete(db.collection('utenti').doc(uid).collection('appelli').doc(r.id)); });
      return withTimeout(b.commit(), 20000);
    });
  });
  chain.then(function(){
    state.records = state.records.filter(function(r){ return r.groupId !== gid; });
    state.groups = state.groups.filter(function(x){ return x.id !== gid; });
    flushGroups();
    toast('Gruppo condiviso.');
    cur.groupId = gid;
    go('condividi');
  }, function(){
    toast('Non sono riuscito a condividere il gruppo. Controlla la connessione e riprova.');
  });
}

/* ---------- eliminare un gruppo condiviso (solo proprietari) ---------- */
function deleteAll(col){
  return col.limit(400).get().then(function(s){
    if(!s.docs.length) return null;
    var b = db.batch();
    s.docs.forEach(function(d){ b.delete(d.ref); });
    return b.commit().then(function(){ return s.docs.length >= 400 ? deleteAll(col) : null; });
  });
}
function sharedDeleteGroup(g){
  if(g.role !== 'owner') return;
  askConfirm({ title:'Eliminare “' + g.name + '” per tutti?', text:'Il gruppo, le persone e tutto lo storico degli appelli vengono cancellati per tutti i membri. Non si può annullare.', yes:'Elimina per tutti', danger:true, onYes:function(){
    g.leaving = true;
    var gref = db.collection('gruppi').doc(g.id);
    var others = g.staff.filter(function(x){ return x.uid !== sh.uid; });
    deleteAll(gref.collection('appelli'))
      .then(function(){ return deleteAll(gref.collection('live')); })
      .then(function(){ return deleteAll(db.collection('inviti').where('gid', '==', g.id)); })
      .then(function(){ return gref.delete(); })
      .then(function(){ return Promise.all(others.map(function(x){ return gref.collection('membri').doc(x.uid).delete(); })); })
      .then(function(){ return gref.collection('membri').doc(sh.uid).delete(); })
      .then(function(){ return db.collection('utenti').doc(sh.uid).collection('condivisi').doc(g.id).delete(); })
      .then(function(){
        toast('Gruppo eliminato.');
        cur.groupId = null; go('home');
      }, function(){
        g.leaving = false;
        toast('Non sono riuscito a eliminare tutto il gruppo. Controlla la connessione e riprova.');
      });
  }});
}

/* ---------- collegamento con le funzioni originali ---------- */
/* salvataggio degli appelli dei gruppi condivisi nel loro storico comune */
var makeCloudBase = makeCloud;
makeCloud = function(userId){
  var c = makeCloudBase(userId);
  var saveBase = c.saveRecord;
  c.saveRecord = function(rec){
    var g = sh.groups[rec.groupId];
    if(g && g.shared){
      rec.by = userId; rec.byLabel = acct.name;
      return ack(db.collection('gruppi').doc(g.id).collection('appelli').doc(rec.id).set(rec));
    }
    return saveBase(rec);
  };
  return c;
};
/* avvio e chiusura del collegamento ai gruppi condivisi insieme alla sessione */
var startSessionBase = startSession;
startSession = function(user){ startSessionBase(user); startShared(user); };
var endSessionBase = endSession;
endSession = function(){ stopShared(); endSessionBase(); };

/* pulsanti e moduli nuovi, e modifiche alle persone/eliminazione per i gruppi condivisi
   (vengono intercettati prima della gestione originale, che resta per i gruppi personali) */
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var act = el.dataset.act, g = findGroup();
  if(g && g.shared && (act === 'remove-member' || act === 'delete-group')){
    e.stopImmediatePropagation();
    if(act === 'remove-member') sharedRemovePerson(g, el.dataset.id); else sharedDeleteGroup(g);
    return;
  }
  if(act.indexOf('sh-') !== 0) return;
  e.stopImmediatePropagation();
  if(act === 'sh-join'){ go('unisciti'); }
  else if(act === 'sh-open'){ go('condividi'); }
  else if(act === 'sh-back'){ go('membri'); }
  else if(act === 'sh-share'){ if(g && !g.shared) shareGroup(g); }
  else if(act === 'sh-invite'){ if(g && g.shared && g.role === 'owner') createInvite(g); }
  else if(act === 'sh-revoke'){ revokeInvite(g); }
  else if(act === 'sh-copy'){ copyCode(); }
  else if(act === 'sh-leave'){ if(g && g.shared) askLeave(g); }
  else if(act === 'sh-promote' || act === 'sh-demote' || act === 'sh-kick'){ if(g && g.shared && g.role === 'owner') changeStaff(g, act, el.dataset.id); }
  else if(act === 'sh-warn-continue'){
    sh.dismissed = true;
    var box = document.getElementById('liveWarn');
    if(box) box.hidden = true;
  }
  else if(act === 'sh-warn-ok'){
    cur.marks = null;
    go('home');
  }
}, true);
app.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id === 'formMember'){
    var g = findGroup();
    if(g && g.shared){ e.preventDefault(); e.stopImmediatePropagation(); sharedAddPerson(g, f.elements.memberName.value); }
  } else if(f.id === 'formJoin'){
    e.preventDefault(); e.stopImmediatePropagation(); joinGroup(f.elements.code.value);
  }
}, true);



})();
</script>
